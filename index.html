<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Bounce</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        .logo {
            position: absolute;
            left: 0;
            top: 0;
            width: 200px;
            filter: invert(1);
            user-select: none;
            will-change: transform;
        }
    </style>
</head>
<body>
    <script>
        const SVG_SRC = 'dvd-logo.svg';
        const LOGO_WIDTH = 200;   // px
        const SPEED = 120;        // px per second

        const logos = [];
        let logoHeight = 0;
        let ready = false;
        let lastTime = null;

        // Pick a random color for a logo
        function randomColorFilter() {
            const hue = Math.floor(Math.random() * 360);
            return `invert(1) sepia(1) saturate(10000%) hue-rotate(${hue}deg)`;
        }

        // Create a new logo centered on (cx, cy), moving at the given angle
        function spawnLogo(cx, cy, angle) {
            const el = document.createElement('img');
            el.src = SVG_SRC;
            el.alt = 'DVD logo';
            el.className = 'logo';
            el.draggable = false;
            el.style.width = LOGO_WIDTH + 'px';
            el.style.height = logoHeight + 'px';
            el.style.filter = randomColorFilter();
            document.body.appendChild(el);

            // Keep the new logo fully on screen
            const x = Math.min(Math.max(0, cx - LOGO_WIDTH / 2), window.innerWidth - LOGO_WIDTH);
            const y = Math.min(Math.max(0, cy - logoHeight / 2), window.innerHeight - logoHeight);

            logos.push({
                el,
                x,
                y,
                dx: Math.cos(angle) * SPEED,
                dy: Math.sin(angle) * SPEED
            });
        }

        function randomAngle() {
            return Math.random() * Math.PI * 2;
        }

        function animate(time) {
            if (lastTime === null) {
                lastTime = time;
            }

            // Seconds since the last frame, capped so logos don't jump
            // far if the tab was in the background.
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            const maxX = window.innerWidth - LOGO_WIDTH;
            const maxY = window.innerHeight - logoHeight;

            for (const logo of logos) {
                logo.x += logo.dx * dt;
                logo.y += logo.dy * dt;

                // Bounce off the left/right edges
                if (logo.x <= 0) {
                    logo.x = 0;
                    logo.dx = Math.abs(logo.dx);
                    logo.el.style.filter = randomColorFilter();
                } else if (logo.x >= maxX) {
                    logo.x = Math.max(0, maxX);
                    logo.dx = -Math.abs(logo.dx);
                    logo.el.style.filter = randomColorFilter();
                }

                // Bounce off the top/bottom edges
                if (logo.y <= 0) {
                    logo.y = 0;
                    logo.dy = Math.abs(logo.dy);
                    logo.el.style.filter = randomColorFilter();
                } else if (logo.y >= maxY) {
                    logo.y = Math.max(0, maxY);
                    logo.dy = -Math.abs(logo.dy);
                    logo.el.style.filter = randomColorFilter();
                }

                logo.el.style.transform = `translate(${logo.x}px, ${logo.y}px)`;
            }

            requestAnimationFrame(animate);
        }

        // Clicking anywhere spawns another logo going in a random direction
        window.addEventListener('click', (e) => {
            if (!ready) return;
            spawnLogo(e.clientX, e.clientY, randomAngle());
        });

        // Measure the logo's height once the image has loaded, then start
        // The SVG has no fixed pixel size, so let the browser size it at
        // LOGO_WIDTH and read back the height it ends up with.
        const measure = document.createElement('img');
        measure.src = SVG_SRC;
        measure.className = 'logo';
        measure.style.width = LOGO_WIDTH + 'px';
        measure.style.visibility = 'hidden';
        document.body.appendChild(measure);
        measure.onload = () => {
            logoHeight = measure.offsetHeight;
            measure.remove();
            ready = true;
            spawnLogo(window.innerWidth / 2, window.innerHeight / 2, randomAngle());
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
